name: Build SVT-AV1 Tritium Static Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      # 1. Pull the active, modernized Tritium psychovisual repository 
      - name: Checkout SVT-AV1-Tritium Source
        uses: actions/checkout@v4
        with:
          repository: 'Uranite/svt-av1-tritium'
          path: 'svt-av1-source'

      # 2. Force static standalone linkage using native backend features
      - name: Build SVT-AV1
        uses: Akatmks/build-svt-av1@v2
        with:
          path: "./svt-av1-source"
          static: "true"
          shared: "false"
          pgo-video: "FoodMarket2"
          pgo-parameters: "--crf 20 --tune 0"
          ffms2: "true"          # Statically binds container input mapping (.mp4 / .mkv)
          base-arch-only: "false" # Unlocks the missing icelake-server+znver5 folder tier

      # 3. Securely pack and grab the finalized multi-profile optimized binary folder
      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: SVT-AV1-Tritium_static_ffms2_dovi_hdr10plus
          path: svt-av1-source/BuildAction/
          if-no-files-found: error
