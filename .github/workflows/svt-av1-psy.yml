name: Build SVT-AV1 Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      # 1. Pull the SVT-AV1-Essential feature-set source repository
      - name: Checkout SVT-AV1-Essential Source
        uses: actions/checkout@v4
        with:
          repository: 'nekotrix/SVT-AV1-Essential'
          path: 'svt-av1-source'

      # 2. Force true standalone static embedding using native backend feature toggles
      - name: Build SVT-AV1
        uses: Akatmks/build-svt-av1@v2
        with:
          path: "./svt-av1-source"
          static: "true"
          shared: "false"
          pgo-video: "FoodMarket2"
          pgo-parameters: "--crf 20 --tune 0"
          ffms2: "true"            # Fuses static FFMS2 container decoding hooks (.mp4/.mkv reading)
          webm: "true"             # Fuses static WebM container output hooks safely
          base-arch-only: "false"  # Unlocks the missing icelake-server+znver5 folder tier

      # 3. Securely pack and grab the single finalized static executable folders
      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: SVT-AV1-Essential_static_ffms2_dovi_hdr10plus_webm
          path: svt-av1-source/BuildAction/
          if-no-files-found: error
