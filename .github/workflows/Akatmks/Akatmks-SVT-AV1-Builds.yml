name: Build SVT-AV1 HDR Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 1. Pull the SVT-AV1-HDR fork source code instead of mainline
      - name: Checkout SVT-AV1-HDR Source
        uses: actions/checkout@v4
        with:
          repository: 'juliobbv-p/svt-av1-hdr'
          path: 'svt-av1-source'

      # 2. Compile using the live-action benchmark profile (FoodMarket2)
      - name: Build SVT-AV1
        uses: Akatmks/build-svt-av1@v2
        with:
          path: "./svt-av1-source"
          static: "true"
          shared: "false"
          pgo-video: "FoodMarket2" # Tailors the PGO optimization pass for live-action movies
          pgo-parameters: "--crf 20 --tune 0"

      # 3. Securely upload the finalized app executable 
      - name: Upload Windows App Binary
        uses: actions/upload-artifact@v4
        with:
          name: SVT-AV1-HDR-Windows-Binary
          path: svt-av1-source/**/SvtAv1EncApp.exe
          if-no-files-found: error
